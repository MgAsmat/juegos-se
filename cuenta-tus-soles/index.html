<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cuenta tus Soles — Juego de matemática con billetes y monedas del Perú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FAF8F3;
    --surface: #FFFFFF;
    --ink: #1C2333;
    --ink-soft: #656F87;
    --ink-faint: #9AA2B5;
    --accent: #BD8A2B;
    --accent-deep: #93691C;
    --accent-soft: #F3E7C8;
    --line: #E8E3D7;
    --line-soft: #F0ECE1;
    --correct: #1F7A50;
    --correct-bg: #E5F3EA;
    --wrong: #B23C33;
    --wrong-bg: #FBEAE8;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(28,35,51,.05);
    --shadow-md: 0 4px 16px -8px rgba(28,35,51,.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper: #12151F;
      --surface: #1A1E2B;
      --ink: #F1EFE7;
      --ink-soft: #A2A9BE;
      --ink-faint: #6E7488;
      --accent: #E3B657;
      --accent-deep: #F0C878;
      --accent-soft: rgba(227,182,87,.14);
      --line: rgba(255,255,255,.09);
      --line-soft: rgba(255,255,255,.05);
      --correct: #57B98C;
      --correct-bg: rgba(87,185,140,.13);
      --wrong: #DE7B72;
      --wrong-bg: rgba(222,123,114,.14);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
      --shadow-md: 0 4px 16px -8px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3{ margin:0; line-height:1.15; text-wrap: balance; font-weight:800; letter-spacing:-.01em; }
  .mono, .tabular{
    font-family: 'IBM Plex Mono', 'Manrope', monospace;
    font-variant-numeric: tabular-nums;
  }
  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background: var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- Encabezado ---------- */
  .app-header{
    padding: 22px 20px 16px;
    display:flex;
    align-items:center;
    gap:13px;
    border-bottom: 1px solid var(--line);
  }
  .brand-mark{
    width:42px;height:42px;flex:0 0 42px;
    border-radius:13px;
    background: var(--accent);
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:16px;
  }
  .brand-text h1{ font-size: 19px; font-weight:800; color:var(--ink); }
  .brand-text p{ margin:2px 0 0; font-size:12.5px; font-weight:500; color:var(--ink-soft); }

  main.screen{
    flex:1;
    padding: 18px 18px 96px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow-sm);
  }
  .eyebrow{
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color: var(--accent-deep);
  }

  /* ---------- Formularios ---------- */
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .field label{ font-size:13px; font-weight:600; color:var(--ink-soft); }
  .field input, .field select{
    font-family:'Manrope',sans-serif;
    font-size:15px;
    font-weight:500;
    padding:11px 13px;
    border-radius: var(--radius-sm);
    border:1.5px solid var(--line);
    background: var(--paper);
    color:var(--ink);
    outline:none;
  }
  .field input:focus, .field select:focus, button:focus-visible, .opcion-btn:focus-visible, .combo-btn:focus-visible{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .field-hint{ font-size:12px; color:var(--ink-faint); margin-top:8px; line-height:1.5;}

  .segmented{
    display:flex;
    border-radius: 999px;
    background: var(--line-soft);
    padding:3px;
    gap:3px;
    border:1px solid var(--line);
  }
  .segmented button{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 8px;
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:13.5px;
    color: var(--ink-soft);
    border-radius:999px;
    cursor:pointer;
    transition: background .15s ease, color .15s ease;
  }
  .segmented button.activo{
    background: var(--ink);
    color: var(--surface);
  }

  button{ cursor:pointer; font-family:'Manrope',sans-serif; }
  .btn{
    width:100%;
    padding:14px 18px;
    border-radius: 999px;
    border:none;
    font-size:15px;
    font-weight:700;
    transition: transform .08s ease, background .15s ease;
  }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{ background: var(--accent); color:#fff; }
  .btn-primary:hover{ background: var(--accent-deep); }
  .btn-secondary{ background: var(--surface); color:var(--ink); border:1.5px solid var(--line); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  /* ---------- Niveles ---------- */
  .niveles-grid{ display:flex; flex-direction:column; gap:10px; }
  .nivel-card{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    background: var(--surface);
    border:1px solid var(--line);
    border-radius: var(--radius-md);
    padding:14px 16px 14px 18px;
    text-align:left;
    width:100%;
    box-shadow: var(--shadow-sm);
    transition: border-color .12s ease, transform .12s ease;
  }
  .nivel-card::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:3px;
    border-radius: var(--radius-md) 0 0 var(--radius-md);
    background: var(--nivel-color, var(--accent));
  }
  .nivel-card:hover{ border-color: var(--nivel-color, var(--accent)); transform: translateY(-1px); }
  .nivel-icono{ flex:0 0 auto; width:56px; display:flex; align-items:center; justify-content:center; }
  .icono-row{ display:flex; }
  .icono-pieza{ width:30px; margin-right:-8px; }
  .icono-row .icono-pieza svg{ width:100%; display:block; }
  .icono-percent{
    font-family:'Manrope',sans-serif; font-size:22px; font-weight:800; color: var(--accent-deep);
    width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background: var(--accent-soft);
  }
  .nivel-texto{ flex:1; min-width:0; }
  .nivel-badge{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.04em;
    color: var(--accent-deep);
    background: var(--accent-soft);
    padding:2px 8px;
    border-radius:999px;
    margin-bottom:5px;
  }
  .nivel-texto h3{ font-size:16px; font-weight:700; }
  .nivel-texto p{ margin:3px 0 0; font-size:12.5px; font-weight:500; color:var(--ink-soft); }

  /* ---------- Juego ---------- */
  .game-top{ display:flex; align-items:center; justify-content:space-between; }
  .corazones{ display:flex; gap:4px; }
  .racha-badge{
    display:flex; align-items:center; gap:6px; font-weight:700; font-size:13px; color: var(--accent-deep);
    background: var(--accent-soft); padding:5px 10px 5px 6px; border-radius:999px;
  }
  .racha-badge .pieza-mini{ width:18px; }
  .racha-badge .pieza-mini svg{ width:100%; display:block; }

  .timerbar{ height:6px; border-radius:999px; background: var(--line); overflow:hidden; margin:16px 0 2px; }
  .timerbar-fill{ height:100%; background: var(--accent); border-radius:999px; transition: width .1s linear, background .2s; }

  .nivel-tag{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; letter-spacing:.02em; color:var(--ink-faint); margin-bottom:4px; }
  .nivel-titulo{ font-size:18px; font-weight:800; margin-bottom:14px; }

  .pregunta-enunciado{ font-size:16px; font-weight:500; line-height:1.5; margin-bottom:16px; }

  .pregunta-visual{
    display:flex; gap:12px; justify-content:center; align-items:center; flex-wrap:wrap;
    margin-bottom:18px; padding:20px 10px;
    background: var(--paper);
    border-radius: var(--radius-md);
  }
  .pieza-svg{ width:92px; }
  .pieza-svg.pieza-moneda{ width:66px; }

  .opciones-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:9px; }
  .opcion-btn{
    background: var(--surface);
    border:1.5px solid var(--line);
    border-radius: var(--radius-md);
    padding:14px 10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:14.5px;
    font-weight:600;
    color: var(--ink);
    text-align:center;
    transition: border-color .12s ease;
  }
  .opcion-btn:not(:disabled):hover{ border-color: var(--accent); }
  .opcion-btn.correcta{ background: var(--correct-bg); border-color: var(--correct); color: var(--correct); }
  .opcion-btn.incorrecta{ background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }
  .opcion-btn:disabled{ cursor:default; }

  .combo-list{ display:flex; flex-direction:column; gap:9px; }
  .combo-btn{
    display:flex; align-items:center; gap:10px;
    background: var(--surface); border:1.5px solid var(--line); border-radius: var(--radius-md);
    padding:10px 12px; width:100%; text-align:left;
    transition: border-color .12s ease;
  }
  .combo-btn:not(:disabled):hover{ border-color: var(--accent); }
  .combo-piezas{ display:flex; flex:1; flex-wrap:wrap; gap:2px; }
  .combo-piezas .pieza-mini{ width:28px; margin-right:-7px; }
  .combo-piezas .pieza-mini svg{ width:100%; display:block; }
  .combo-count{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; color: var(--ink-soft); white-space:nowrap; }
  .combo-btn.correcta{ background: var(--correct-bg); border-color: var(--correct); }
  .combo-btn.incorrecta{ background: var(--wrong-bg); border-color: var(--wrong); }
  .combo-btn.correcta .combo-count{ color: var(--correct); }
  .combo-btn.incorrecta .combo-count{ color: var(--wrong); }

  /* ---------- Resultado ---------- */
  .resultado{ text-align:center; }
  .resultado-titulo{ font-size:21px; font-weight:800; margin-bottom:3px; }
  .resultado-sub{ color:var(--ink-faint); font-size:12.5px; font-weight:600; letter-spacing:.03em; margin-bottom:18px; font-family:'IBM Plex Mono',monospace; }
  .puntaje-grande{ font-size:54px; font-weight:800; color:var(--ink); letter-spacing:-.02em; }
  .puntaje-label{ font-size:11.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:20px; }
  .resultado-stats{ display:flex; justify-content:center; gap:8px; margin-bottom:22px; }
  .resultado-stat{ flex:1; max-width:140px; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 6px; }
  .resultado-stat b{ display:block; font-size:18px; font-weight:800; color:var(--accent-deep); }
  .resultado-stat span{ font-size:11px; color:var(--ink-soft); font-weight:500; }
  .resultado-acciones{ display:flex; flex-direction:column; gap:9px; margin-top:4px; }

  /* ---------- Ranking ---------- */
  .ranking-header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:2px; }
  .ranking-semana{ font-size:12px; color:var(--ink-faint); margin-bottom:16px; font-weight:500; }

  .podio{ display:flex; align-items:flex-end; justify-content:center; gap:8px; margin-bottom:20px; }
  .podio-puesto{ flex:1; max-width:150px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .medalla{
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:14px; color:#fff;
    margin-bottom:8px;
  }
  .puesto-1 .medalla{ background: var(--accent); width:46px; height:46px; font-size:17px; }
  .puesto-2 .medalla{ background: #9AA2B5; }
  .puesto-3 .medalla{ background: #B4835A; }
  .podio-nombre{ font-weight:700; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .podio-puntaje{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13px; color:var(--accent-deep); }
  .podio-base{ margin-top:8px; width:100%; border-radius:6px 6px 0 0; background: var(--line-soft); }
  .puesto-1 .podio-base{ height:40px; }
  .puesto-2 .podio-base{ height:26px; }
  .puesto-3 .podio-base{ height:16px; }

  .ranking-row{
    display:flex; align-items:center; gap:12px;
    padding:11px 4px;
    border-bottom:1px solid var(--line-soft);
  }
  .ranking-row:last-child{ border-bottom:none; }
  .rank-num{ width:22px; text-align:center; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13px; color: var(--ink-faint); flex:0 0 22px; }
  .rank-info{ flex:1; min-width:0; }
  .rank-nombre{ font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank-meta{ font-size:11.5px; color:var(--ink-faint); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank-puntaje{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14.5px; color: var(--ink); flex:0 0 auto; }

  .estado-vacio, .estado-cargando{ text-align:center; padding:32px 10px; color:var(--ink-soft); font-size:13.5px; font-weight:500; }
  .estado-icono{ margin:0 auto 12px; width:36px; }
  .estado-icono svg{ width:100%; display:block; }
  .estado-cargando .estado-icono{ animation: girar 1s linear infinite; }
  @keyframes girar{ to{ transform: rotate(360deg); } }

  .tabbar{
    position:sticky; bottom:0;
    display:flex;
    background: var(--paper);
    border-top:1px solid var(--line);
    padding: 8px 18px calc(8px + env(safe-area-inset-bottom));
    gap:6px;
  }
  .tab{
    flex:1;
    background:none; border:none;
    padding:9px 4px;
    font-size:12.5px; font-weight:700;
    color: var(--ink-faint);
    border-radius: var(--radius-sm);
    transition: background .12s ease, color .12s ease;
  }
  .tab.activo{ color: var(--accent-deep); background: var(--accent-soft); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="brand-mark">S/</div>
    <div class="brand-text">
      <h1>Cuenta tus Soles</h1>
      <p>Matemática con billetes y monedas del Perú</p>
    </div>
  </header>
  <main id="screen" class="screen"></main>
  <nav class="tabbar">
    <button class="tab" data-tab="jugar">Jugar</button>
    <button class="tab" data-tab="ranking">Ranking semanal</button>
  </nav>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- Datos base ----------------
     Colores de billete aproximados a la familia vigente de billetes
     del BCRP (2015-2021): S/10 verde, S/20 ocre, S/50 rosa,
     S/100 azul-teal, S/200 morado. Ilustración estilizada en bloques
     de color plano — no reproduce el diseño impreso real. */
  var BILLETES = [10,20,50,100,200];
  var MONEDAS = [0.10,0.20,0.50,1,2,5];
  var COLOR_BILLETE = {10:'#3F9468',20:'#AD8A3E',50:'#BD4E76',100:'#1E80A8',200:'#7C5CA8'};
  var COLOR_BILLETE_DEEP = {10:'#2A6B4A',20:'#7C6024',50:'#8A3253',100:'#145D7C',200:'#56397B'};

  var ARTICULOS = [
    {nombre:'un cuaderno', precio:6.50},
    {nombre:'una lonchera', precio:15.00},
    {nombre:'un lápiz', precio:1.20},
    {nombre:'una gaseosa', precio:3.50},
    {nombre:'una empanada', precio:4.00},
    {nombre:'una caja de colores', precio:12.90},
    {nombre:'una mochila pequeña', precio:38.00},
    {nombre:'un libro de cuentos', precio:22.50},
    {nombre:'una regla', precio:2.00},
    {nombre:'un helado', precio:5.00},
    {nombre:'un jugo', precio:2.50},
    {nombre:'un sánguche', precio:6.00}
  ];

  var PRODUCTOS = [
    {nombre:'una casaca', precio:89},
    {nombre:'unas zapatillas', precio:120},
    {nombre:'una mochila', precio:75},
    {nombre:'un libro', precio:45},
    {nombre:'un reloj', precio:60},
    {nombre:'una lonchera', precio:35},
    {nombre:'unos audífonos', precio:98}
  ];
  var DESCUENTOS = [10,15,20,25,30,50];

  var REGIONES = ['Amazonas','Áncash','Apurímac','Arequipa','Ayacucho','Cajamarca','Callao','Cusco',
    'Huancavelica','Huánuco','Ica','Junín','La Libertad','Lambayeque','Lima','Loreto','Madre de Dios',
    'Moquegua','Pasco','Piura','Puno','San Martín','Tacna','Tumbes','Ucayali'];

  var TOTAL_PREGUNTAS = 10;
  var CORAZONES_INICIALES = 3;

  /* ---------------- Utilidades ---------------- */
  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }
  function elegir(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
  function formatMoney(centimos){
    return 'S/ ' + (centimos/100).toFixed(2);
  }
  function formatDenom(valor){
    if (valor < 1) return Math.round(valor*100) + ' cént.';
    return 'S/ ' + valor;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function generarOpciones(correctoCentimos, unidad){
    var mult = [1,2,3,5,8,10,15,20];
    var valores = {};
    valores[correctoCentimos] = true;
    var intentos = 0;
    while (Object.keys(valores).length < 4 && intentos < 200){
      intentos++;
      var signo = Math.random() < 0.5 ? -1 : 1;
      var delta = elegir(mult) * unidad;
      var val = correctoCentimos + signo*delta;
      if (val > 0 && !valores[val]) valores[val] = true;
    }
    var arr = Object.keys(valores).map(Number);
    shuffle(arr);
    return arr.map(function(v){
      return { label: formatMoney(v), value:v, correcta: v === correctoCentimos };
    });
  }

  /* ---------------- Piezas visuales ----------------
     Bloques planos de color, sin degradados ni texturas — estilo
     ilustrado y minimalista, de fantasía. No reproduce el diseño
     impreso real de los billetes y monedas peruanos. */
  function billeteSVG(valor){
    var color = COLOR_BILLETE[valor] || '#3F9468';
    return '<svg viewBox="0 0 220 110" class="pieza-svg" role="img" aria-label="Billete fantasía de ' + valor + ' soles">' +
      '<rect x="1.5" y="1.5" width="217" height="107" rx="14" fill="' + color + '" stroke="rgba(0,0,0,.08)" stroke-width="1"/>' +
      '<text x="20" y="40" fill="#fff" font-family="Manrope, sans-serif" font-size="12" font-weight="700" letter-spacing="1" opacity=".85">SOLES</text>' +
      '<text x="20" y="83" fill="#fff" font-family="Manrope, sans-serif" font-size="38" font-weight="800">' + valor + '</text>' +
      '<line x1="168" y1="16" x2="168" y2="94" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>' +
      '<text x="196" y="60" fill="#fff" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" transform="rotate(90 196 60)">S/' + valor + '</text>' +
      '</svg>';
  }
  function monedaSVG(valor){
    var esSol = valor >= 1;
    var color = esSol ? '#C79A3D' : '#B0733F';
    var label = valor < 1 ? Math.round(valor*100) + '¢' : ('S/' + valor);
    return '<svg viewBox="0 0 110 110" class="pieza-svg pieza-moneda" role="img" aria-label="Moneda fantasía de ' + label + '">' +
      '<circle cx="55" cy="55" r="49" fill="' + color + '" stroke="rgba(0,0,0,.1)" stroke-width="1"/>' +
      '<circle cx="55" cy="55" r="39" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.5"/>' +
      '<text x="55" y="63" text-anchor="middle" fill="#fff" font-family="Manrope, sans-serif" font-size="20" font-weight="800">' + label + '</text>' +
      '</svg>';
  }
  function piezaSVG(valor){

  /* ---------------- Generadores de preguntas ---------------- */
  function generarPreguntaReconoce(){
    var esBillete = Math.random() < 0.5;
    var pool = esBillete ? BILLETES : MONEDAS;
    var valor = elegir(pool);
    var distractores = shuffle(pool.filter(function(v){ return v !== valor; })).slice(0,3);
    var valoresOpciones = shuffle([valor].concat(distractores));
    return {
      enunciado: '¿Cuánto vale ' + (esBillete ? 'este billete' : 'esta moneda') + '?',
      visual: [valor],
      opciones: valoresOpciones.map(function(v){
        return { label: formatDenom(v), value:v, correcta: v === valor };
      })
    };
  }

  function generarPreguntaSuma(){
    var pool = [0.10,0.20,0.50,1,2,5,10,20];
    var cantidad = Math.random() < 0.5 ? 2 : 3;
    var piezas = [];
    for (var i=0;i<cantidad;i++){ piezas.push(elegir(pool)); }
    var totalCentimos = Math.round(piezas.reduce(function(a,b){return a+b;},0) * 100);
    return {
      enunciado: '¿Cuánto dinero hay en total?',
      visual: piezas,
      opciones: generarOpciones(totalCentimos, 10)
    };
  }

  function generarPreguntaVueltoSimple(){
    var articulo = elegir(ARTICULOS);
    var precioCentimos = Math.round(articulo.precio * 100);
    var billetesValidos = BILLETES.filter(function(b){ return b*100 > precioCentimos; });
    var billete = billetesValidos.length ? elegir(billetesValidos) : 20;
    var vueltoCentimos = billete*100 - precioCentimos;
    return {
      enunciado: 'Compras ' + articulo.nombre + ' que cuesta ' + formatMoney(precioCentimos) + '. Pagas con un billete de S/ ' + billete + '. ¿Cuánto es tu vuelto?',
      visual: [billete],
      opciones: generarOpciones(vueltoCentimos, 10)
    };
  }

  var DENOMS_SOLES = [200,100,50,20,10,5,2,1];
  var SPLIT_MAP = {200:[100,100],100:[50,50],50:[20,20,10],20:[10,10],10:[5,5],5:[2,2,1],2:[1,1]};

  function greedyCombo(soles){
    var resto = soles, piezas = [];
    DENOMS_SOLES.forEach(function(d){
      while (resto >= d){ piezas.push(d); resto -= d; }
    });
    return piezas;
  }
  function splitOnce(piezas){
    var candidatos = [];
    piezas.forEach(function(p,i){ if (SPLIT_MAP[p]) candidatos.push(i); });
    if (!candidatos.length) return piezas.slice();
    var idx = elegir(candidatos);
    var nuevas = piezas.slice();
    var reemplazo = SPLIT_MAP[nuevas[idx]];
    nuevas.splice.apply(nuevas, [idx,1].concat(reemplazo));
    return nuevas;
  }
  function comboKey(piezas){ return piezas.slice().sort(function(a,b){return a-b;}).join('-') + '|' + piezas.length; }

  function generarPreguntaCombina(){
    var montoSoles = 12 + Math.floor(Math.random()*180);
    var correcta = greedyCombo(montoSoles);
    var vistos = {}; vistos[comboKey(correcta)] = true;
    var alternativas = [];
    var base = correcta;
    var intentosTotales = 0;
    while (alternativas.length < 3 && intentosTotales < 40){
      intentosTotales++;
      base = splitOnce(base.length > correcta.length ? base : correcta);
      var k = comboKey(base);
      if (!vistos[k] && base.length > correcta.length){
        vistos[k] = true;
        alternativas.push(base.slice());
      }
      if (intentosTotales % 8 === 0) base = correcta;
    }
    while (alternativas.length < 3){
      alternativas.push(splitOnce(correcta).length > correcta.length ? splitOnce(correcta) : correcta.concat([]));
    }
    var combos = shuffle([
      { piezas: correcta, correcta: true },
      { piezas: alternativas[0], correcta: false },
      { piezas: alternativas[1], correcta: false },
      { piezas: alternativas[2], correcta: false }
    ]);
    return {
      enunciado: 'Quieres pagar exactamente S/ ' + montoSoles + '. ¿Cuál combinación usa la menor cantidad de billetes y monedas?',
      combos: combos
    };
  }

  function generarPreguntaVueltoComplejo(){
    var cantidad = Math.random() < 0.5 ? 2 : 3;
    var copia = shuffle(ARTICULOS.slice());
    var elegidos = copia.slice(0, cantidad);
    var sumaCentimos = elegidos.reduce(function(a,art){ return a + Math.round(art.precio*100); }, 0);
    var billetesValidos = BILLETES.filter(function(b){ return b*100 > sumaCentimos; });
    var billete = billetesValidos.length ? elegir(billetesValidos) : 200;
    var vueltoCentimos = billete*100 - sumaCentimos;
    var listaTexto = elegidos.map(function(a){ return a.nombre + ' (' + formatMoney(Math.round(a.precio*100)) + ')'; }).join(', ');
    return {
      enunciado: 'Compras ' + listaTexto + '. Pagas con un billete de S/ ' + billete + '. ¿Cuánto es tu vuelto?',
      visual: [billete],
      opciones: generarOpciones(vueltoCentimos, 10)
    };
  }

  function generarPreguntaDescuento(){
    var producto = elegir(PRODUCTOS);
    var descuento = elegir(DESCUENTOS);
    var precioCentimos = producto.precio*100;
    var ahorroCentimos = Math.round(precioCentimos * descuento / 100);
    var finalCentimos = precioCentimos - ahorroCentimos;
    var preguntarAhorro = Math.random() < 0.5;
    var objetivo = preguntarAhorro ? ahorroCentimos : finalCentimos;
    return {
      enunciado: capitalize(producto.nombre) + ' cuesta ' + formatMoney(precioCentimos) + ' y tiene un descuento del ' + descuento + '%. ¿Cuánto ' + (preguntarAhorro ? 'ahorras' : 'pagas') + '?',
      opciones: generarOpciones(objetivo, 50)
    };
  }

  /* ---------------- Semana ISO (para el ranking) ---------------- */
  function getISOWeekInfo(date){
    var d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    var dayNum = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
    var weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    var monday = new Date(d); monday.setUTCDate(d.getUTCDate() - 3);
    var sunday = new Date(monday); sunday.setUTCDate(monday.getUTCDate() + 6);
    var meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    var rango = monday.getUTCDate() + ' ' + meses[monday.getUTCMonth()] + ' – ' + sunday.getUTCDate() + ' ' + meses[sunday.getUTCMonth()];
    return { key: d.getUTCFullYear() + '-W' + String(weekNo).padStart(2,'0'), rango: rango };
  }

  /* ---------------- Almacenamiento (ranking compartido) ---------------- */
  function storageDisponible(){ return typeof window.storage !== 'undefined' && window.storage; }

  function guardarEnRanking(entrada, categoria){
    var semana = getISOWeekInfo(new Date());
    var key = 'leaderboard:' + semana.key + ':' + categoria;
    if (!storageDisponible()) return Promise.resolve(false);
    return window.storage.get(key, true).catch(function(){ return null; }).then(function(res){
      var lista = [];
      try{ if (res && res.value) lista = JSON.parse(res.value); }catch(e){ lista = []; }
      lista.push(entrada);
      lista.sort(function(a,b){ return b.puntaje - a.puntaje; });
      lista = lista.slice(0,50);
      return window.storage.set(key, JSON.stringify(lista), true).then(function(){ return true; });
    }).catch(function(){ return false; });
  }

  function cargarRanking(categoria){
    var semana = getISOWeekInfo(new Date());
    var key = 'leaderboard:' + semana.key + ':' + categoria;
    if (!storageDisponible()) return Promise.resolve({ lista: [], rango: semana.rango });
    return window.storage.get(key, true).catch(function(){ return null; }).then(function(res){
      var lista = [];
      try{ if (res && res.value) lista = JSON.parse(res.value); }catch(e){ lista = []; }
      return { lista: lista, rango: semana.rango };
    });
  }

  var screenEl = document.getElementById('screen');

  function ir(pantalla){
    if (state.timerId){ clearInterval(state.timerId); state.timerId = null; }
    state.screen = pantalla;
    render();
  }

  /* ---------------- Render principal ---------------- */
  function render(){
    document.querySelectorAll('.tab').forEach(function(t){
      var activo = (t.dataset.tab === 'jugar' && state.screen !== 'ranking') ||
                   (t.dataset.tab === 'ranking' && state.screen === 'ranking');
      t.classList.toggle('activo', activo);
    });

    if (state.screen === 'niveles') return renderNiveles();
    if (state.screen === 'juego') return renderJuego();
    if (state.screen === 'resultado') return renderResultado();
    if (state.screen === 'ranking') return renderRanking();
  }

      '<div class="segmented" id="seg-categoria-niveles">' +
        '<button data-val="primaria" class="' + (state.categoria==='primaria'?'activo':'') + '">Primaria</button>' +
        '<button data-val="secundaria" class="' + (state.categoria==='secundaria'?'activo':'') + '">Secundaria</button>' +
      '</div>' +
      '<div class="niveles-grid" id="niveles-grid"></div>';

  function iniciarNivel(nivel){
    if (state.timerId){ clearInterval(state.timerId); state.timerId = null; }
    state.nivelActual = nivel;
    state.preguntaIndex = 0;
    state.corazones = CORAZONES_INICIALES;
    state.racha = 0;
    state.mejorRacha = 0;
    state.puntaje = 0;
    state.aciertos = 0;
    state.guardado = false;
    state.screen = 'juego';
    iniciarPregunta();
  }

  function iniciarPregunta(){
    var nivel = state.nivelActual;
    state.pregunta = nivel.gen();
    state.respondida = false;
    state.tiempoTotal = nivel.tiempo;
    state.tiempoRestante = nivel.tiempo;
    render();
    if (state.timerId) clearInterval(state.timerId);
    state.timerId = setInterval(function(){
      state.tiempoRestante -= 0.1;
      if (state.tiempoRestante <= 0){
        state.tiempoRestante = 0;
        actualizarTimerUI();
        clearInterval(state.timerId);
        state.timerId = null;
        manejarRespuesta(-1, true);
      } else {
        actualizarTimerUI();
      }
    }, 100);
  }

  function actualizarTimerUI(){
    var fill = document.getElementById('timer-fill');
    if (!fill) return;
    var pct = Math.max(0, (state.tiempoRestante / state.tiempoTotal) * 100);
    fill.style.width = pct + '%';
    fill.style.background = pct < 25 ? 'var(--wrong)' : 'var(--accent)';
  }

  function renderJuego(){
    var nivel = state.nivelActual;
    var p = state.pregunta;

    var corazonesHtml = '';
    for (var i=0;i<CORAZONES_INICIALES;i++){ corazonesHtml += heartSVG(i < state.corazones); }

    var visualHtml = '';
    if (p.visual){
      visualHtml = '<div class="pregunta-visual">' + p.visual.map(function(v){ return piezaSVG(v); }).join('') + '</div>';

          return '<button class="opcion-btn" data-i="' + i + '">' + o.label + '</button>';
        }).join('') +
        '</div>';
    } else if (p.combos){
      opcionesHtml = '<div class="combo-list" id="opciones">' +
        p.combos.map(function(c,i){
          var piezasHtml = c.piezas.map(function(v){ return '<div class="pieza-mini">' + piezaSVG(v) + '</div>'; }).join('');
          return '<button class="combo-btn" data-i="' + i + '">' +
            '<div class="combo-piezas">' + piezasHtml + '</div>' +

        }).join('') +

    }

    screenEl.innerHTML =

        '</div>' +

    var botones = screenEl.querySelectorAll('#opciones button');
    botones.forEach(function(btn){
      btn.addEventListener('click', function(){
        if (state.respondida) return;
        clearInterval(state.timerId); state.timerId = null;
        manejarRespuesta(parseInt(btn.dataset.i,10), false);
      });
    });

  function manejarRespuesta(indiceElegido, porTiempo){
    if (state.respondida) return;
    state.respondida = true;
    var p = state.pregunta;
    var opciones = p.opciones || p.combos;
    var correctaIdx = -1;
    opciones.forEach(function(o,i){ if (o.correcta) correctaIdx = i; });
    var acierto = !porTiempo && indiceElegido === correctaIdx;

    var botones = screenEl.querySelectorAll('#opciones button');
    botones.forEach(function(btn,i){
      btn.disabled = true;
      if (i === correctaIdx) btn.classList.add('correcta');
      else if (i === indiceElegido) btn.classList.add('incorrecta');
    });

    if (acierto){
      state.aciertos++;
      state.racha++;
      state.mejorRacha = Math.max(state.mejorRacha, state.racha);
      var bonusVelocidad = Math.round((state.tiempoRestante / state.tiempoTotal) * 50);
      var bonusRacha = state.racha >= 3 ? 20 : 0;
      state.puntaje += 100 + bonusVelocidad + bonusRacha;
    } else {
      state.corazones--;
      state.racha = 0;
    }

    setTimeout(function(){
      state.preguntaIndex++;
      if (state.preguntaIndex >= TOTAL_PREGUNTAS || state.corazones <= 0){
        ir('resultado');
      } else {
        iniciarPregunta();
      }
    }, 1000);
  }

        var colegio = screenEl.querySelector('#in-colegio').value.trim();
        var region = screenEl.querySelector('#in-region').value;
        if (!nombre){ screenEl.querySelector('#in-nombre').focus(); return; }
        if (!region){ screenEl.querySelector('#in-region').focus(); return; }
        state.player = { nombre: nombre, colegio: colegio || '—', region: region };
        btnGuardar.textContent = 'Guardando…';
        btnGuardar.disabled = true;
        var entrada = {
          nombre: state.player.nombre,
          colegio: state.player.colegio,
          region: state.player.region,
          puntaje: state.puntaje,
          aciertos: state.aciertos,
          fecha: new Date().toISOString()
        };
        guardarEnRanking(entrada, state.categoria).then(function(ok){
          if (ok){
            state.guardado = true;
            renderResultado();
          } else {
            btnGuardar.disabled = false;
            btnGuardar.textContent = 'No se pudo guardar, reintentar';
          }
        });
      });
    }
  }

  function renderRanking(){
    screenEl.innerHTML =
      '<div class="segmented" id="seg-ranking">' +
        '<button data-val="primaria" class="' + (state.rankingCategoria==='primaria'?'activo':'') + '">Primaria</button>' +
        '<button data-val="secundaria" class="' + (state.rankingCategoria==='secundaria'?'activo':'') + '">Secundaria</button>' +
      '</div>' +
      '<div class="card" id="ranking-card"><div class="estado-cargando"><div class="estado-icono">' + monedaSpinnerSVG() + '</div>Cargando el ranking…</div></div>';

    var seg = screenEl.querySelectorAll('#seg-ranking button');
    seg.forEach(function(b){
      b.addEventListener('click', function(){
        state.rankingCategoria = b.dataset.val;
        renderRanking();
      });
    });

    cargarYMostrarRanking();
  }

  function medallaHtml(entrada, puesto){
    return '<div class="podio-puesto puesto-' + puesto + '">' +
      '<div class="medalla">' + puesto + '</div>' +
      '<div class="podio-nombre">' + escapeHtml(entrada.nombre) + '</div>' +
      '<div class="podio-puntaje tabular">' + entrada.puntaje + '</div>' +
      '<div class="podio-base"></div>' +
    '</div>';
  }

  function cargarYMostrarRanking(){
    var card = document.getElementById('ranking-card');
    cargarRanking(state.rankingCategoria).then(function(data){
      if (!card || !document.body.contains(card)) return;
      var lista = data.lista;
      if (!lista.length){
        card.innerHTML =
          '<div class="ranking-header"><h3 style="font-size:15.5px;font-weight:700;">Ranking semanal</h3></div>' +
          '<p class="ranking-semana">Semana del ' + data.rango + '</p>' +
          '<div class="estado-vacio"><div class="estado-icono">' + cofreVacioSVG() + '</div>Todavía no hay resultados esta semana.<br>¡Juega y sé el primero en aparecer aquí!</div>';
        return;
      }

      var podioHtml = '';
      if (lista[0] || lista[1] || lista[2]){
        podioHtml = '<div class="podio">' +
          (lista[1] ? medallaHtml(lista[1], 2) : '<div class="podio-puesto"></div>') +
          (lista[0] ? medallaHtml(lista[0], 1) : '<div class="podio-puesto"></div>') +
          (lista[2] ? medallaHtml(lista[2], 3) : '<div class="podio-puesto"></div>') +
        '</div>';
      }

      var resto = lista.slice(3);
      var filas = resto.map(function(e,i){
        return '<div class="ranking-row">' +
          '<div class="rank-num">' + (i+4) + '</div>' +
          '<div class="rank-info">' +
            '<div class="rank-nombre">' + escapeHtml(e.nombre) + '</div>' +
            '<div class="rank-meta">' + escapeHtml(e.colegio) + ' · ' + escapeHtml(e.region) + '</div>' +
          '</div>' +
          '<div class="rank-puntaje tabular">' + e.puntaje + '</div>' +
        '</div>';
      }).join('');

      card.innerHTML =
        '<div class="ranking-header"><h3 style="font-size:15.5px;font-weight:700;">Ranking semanal</h3></div>' +
        '<p class="ranking-semana">Semana del ' + data.rango + ' · se reinicia cada lunes</p>' +
        podioHtml + filas;
    });
  }

  /* ---------------- Navegación inferior ---------------- */
  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      if (tab.dataset.tab === 'ranking'){
        state.rankingCategoria = state.categoria;
        ir('ranking');
      } else {
        ir('niveles');
      }
    });
  });

  render();
})();
</script>
</body>
</html>
